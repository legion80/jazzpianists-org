{%- comment -%}
Output YouTube embed video.

    vid: video ID only
    start: start time (seconds)
    aspect-ratio: if not the default of 1.778
{%- endcomment -%}
<iframe class="youtube-video" src="https://www.youtube.com/embed/{{ include.vid }}{% if include.start %}?start={{ include.start }}{% endif %}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen {% if include.aspect_ratio %}style="aspect-ratio: {{ include.aspect_ratio }}"{% endif %}></iframe>
