title: The Jazz Pianists
description: >
  Tracing the evolution of jazz piano, one pianist at a time.
baseurl: ""
version: "0.1.1"

favicon-directory: /assets/favicon/
assets-directory: /assets/
image-directory: /assets/images/
timeline-image-directory: /assets/images/timeline/
empty_array: []

social:
  github: https://github.com/legion80/jazzpianists-org
exclude:
  - README.md

plugins:
  - jekyll-feed

collections:
  genres:
    output: true
  people:
    output: true
  albums:
    output: true
  songs:
    output: true
collections_dir: collections
# permalink: pretty
# markdown: kramdown
# kramdown:
#     input: GFM
#
# paginate: 5
# paginate_path: "/some-path/page:num/"

defaults:
  - scope:
      path: ""
    values:
      layout: "page"
  - scope:
      type: "people"
    values:
      layout: "people"